<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="<!--@FAVICON-->">
<title>ALERTAS Traffilog-OnCommand</title>
<style>
/*@FUENTES*/
/*@CSS*/
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Menú principal">
    <div class="brand">
      <div class="logo" id="logoIc"><!--@LOGO--></div>
      
      <div><b>PEMEX</b><small>ALERTAS</small></div>
    </div>
    <div class="system-state">SISTEMA TAD <span class="status-dot"></span></div><h6>Traffilog OnCommand</h6>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><span id="pie"></span><div class="side-user"><div class="avatar" id="userIc"></div><div><b id="suName">Panel de control operativo</b><small id="suRole">Seguridad TAD</small></div></div></div>
  </aside>

  <div class="main-wrap">
    <div class="top">
      <button class="icon-btn" data-act="side" aria-label="Abrir menú" id="menuIc"></button>
      <h1><span>Monitoreo <span class="breadcrumb">/</span></span><b id="crumbMod">Seguridad TAD</b></h1>
      <div class="top-actions"><button class="btn wine" data-act="mail" id="mailBtn" aria-label="Enviar reporte por correo"></button><div class="avatar" id="topAv">TAD</div></div>
    </div>
    <div class="content">
      <section class="filters" id="filters" aria-label="Filtros">
        <div class="row">
          <div class="fld"><span>TAD</span><div class="ms" id="f-tad"></div></div>
          <div class="fld"><span>Año</span><div class="ms" id="f-anio"></div></div>
          <div class="fld"><span>Mes</span><div class="ms" id="f-mes"></div></div>
          <div class="fld"><span>Día</span><div class="ms" id="f-dia"></div></div>
          <div class="fld"><span>Hora</span><div class="ms" id="f-hora"></div></div>
          <div class="fld"><span>Tipo de evento</span><div class="ms" id="f-tipo"></div></div>
          <div class="fld"><span>Estatus</span><div class="ms" id="f-est"></div></div>
          <button class="btn sm" id="btnOmitidos" data-act="omitidos" type="button" hidden></button>
        </div>
        <div class="fbot">
          <div class="chips" id="chips" aria-live="polite"></div>
          <button class="btn sm" id="btnLimpiar" data-act="clear" type="button">Limpiar filtros</button>
          <button class="btn sm" id="btnFiltros" data-act="filtros" type="button" aria-expanded="true" aria-controls="filters" title="Mostrar u ocultar la barra de filtros"></button>
        </div>
      </section>
      <main id="main"></main>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" data-act="closeAll"></div>
<aside class="drawer" id="drawer" aria-label="Boletín del conductor" aria-hidden="true"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Vista previa del correo"></div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status"></div>

<script>
/*@CHARTJS*/
</script>
<script type="application/json" id="datos"><!--@DATOS--></script>
<script>
<!--@JS-->
</script>
</body>
</html>
